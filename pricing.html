<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الأسعار | DoseBot</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Cairo',sans-serif;background:#f0f4ff;color:#1e293b}
nav{background:#fff;border-bottom:1px solid #e2e8f0;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
.nav-btn{padding:8px 18px;background:#1a6fd4;color:#fff;border:none;border-radius:8px;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none}
.hero{text-align:center;padding:48px 20px 32px}
.hero h1{font-size:32px;font-weight:800;margin-bottom:12px}
.hero h1 em{color:#1a6fd4;font-style:normal}
.hero p{color:#64748b;font-size:16px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;max-width:1000px;margin:0 auto;padding:0 20px 60px}
.plan{background:#fff;border:2px solid #e2e8f0;border-radius:16px;padding:28px;position:relative;transition:.2s}
.plan:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,.1)}
.plan.popular{border-color:#1a6fd4}
.badge{position:absolute;top:16px;left:0;background:#1a6fd4;color:#fff;font-size:11px;font-weight:700;padding:4px 12px 4px 10px;border-radius:0 20px 20px 0}
.plan-name{font-size:18px;font-weight:700;margin-bottom:4px}
.plan-price{font-size:36px;font-weight:800;margin:16px 0 4px}
.plan-price span{font-size:14px;color:#64748b;font-weight:400}
.features{list-style:none;margin:16px 0 24px}
.features li{padding:6px 0;border-bottom:1px solid #f1f5f9;font-size:14px;display:flex;gap:8px}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:.2s}
.btn-primary{background:#1a6fd4;color:#fff}
.btn-primary:hover{background:#1558b0}
.btn-outline{background:transparent;color:#1a6fd4;border:2px solid #1a6fd4}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;padding:10px 20px;border-radius:10px;font-size:14px;transition:.3s;z-index:999}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:#16a34a}
.toast.error{background:#dc2626}
</style>
</head>
<body>
<nav>
  <div class="brand">💊 DoseBot</div>
  <a href="auth.html" class="nav-btn" id="navBtn">تسجيل الدخول</a>
</nav>
<div class="hero">
  <h1>اختر خطتك <em>المناسبة</em></h1>
  <p>ابدأ مجاناً وقم بالترقية في أي وقت — اشتراك موحد للموقع والبوت</p>
</div>
<div class="plans" id="plansGrid">
  <div style="grid-column:1/-1;text-align:center;padding:40px;color:#64748b">⏳ جاري التحميل...</div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>
<script>
const API='https://dose-web-api.onrender.com';
const PADDLE_TOKEN='live_xxxxxxxxxxxxxxx';
Paddle.Initialize({token:PADDLE_TOKEN});

function toast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show '+(type||'');
  setTimeout(()=>t.className='toast',3000);
}

async function loadPlans(){
  try{
    const r=await fetch(API+'/plans');
    const plans=await r.json();
    const token=localStorage.getItem('db_token');
    if(token){
      document.getElementById('navBtn').textContent='📊 لوحة التحكم';
      document.getElementById('navBtn').href='dashboard.html';
    }
    document.getElementById('plansGrid').innerHTML=plans.map(p=>{
      const isFree=p.interval==='free';
      const isPop=p.name==='Pro';
      const isYear=p.interval==='year';
      return `<div class="plan ${isPop?'popular':''}">
        ${isPop?'<div class="badge">الأكثر شيوعاً</div>':''}
        <div style="font-size:28px;margin-bottom:8px">${isFree?'🆓':isYear?'⭐':isPop?'🚀':'📦'}</div>
        <div class="plan-name">${p.name_ar}</div>
        <div class="plan-price">${isFree?'مجاني':'$'+p.price}<span>${isFree?'':' / '+(isYear?'سنة':'شهر')}</span></div>
        <ul class="features">${(p.features||[]).map(f=>`<li>✅ ${f}</li>`).join('')}</ul>
        <button class="btn ${isPop?'btn-primary':'btn-outline'}" onclick="${isFree?`location.href='auth.html'`:`checkout('${p.paddle_price_id}','${p.name}')`}">
          ${isFree?'ابدأ مجاناً':isYear?'⭐ اشترك سنوياً':'🚀 اشترك الآن'}
        </button>
      </div>`;
    }).join('');
  }catch(e){
    document.getElementById('plansGrid').innerHTML='<div style="grid-column:1/-1;text-align:center;color:#dc2626">⚠️ تعذّر تحميل الخطط</div>';
  }
}

async function checkout(priceId,name){
  const token=localStorage.getItem('db_token');
  if(!token){toast('سجّل الدخول أولاً','error');setTimeout(()=>location.href='auth.html',1500);return;}
  if(!priceId||priceId==='null'){toast('قريباً! Paddle غير مفعّل بعد','error');return;}
  const me=await fetch(API+'/auth/me',{headers:{Authorization:'Bearer '+token}});
  const user=await me.json();
  Paddle.Checkout.open({
    items:[{priceId,quantity:1}],
    customer:{email:user.email},
    settings:{displayMode:'overlay',theme:'light',locale:'ar',
      successUrl:location.origin+'/dashboard.html?checkout=success'},
    eventCallback:d=>{
      if(d.name==='checkout.completed'){
        toast('🎉 تم الاشتراك بنجاح!','success');
        setTimeout(()=>location.href='dashboard.html?checkout=success',2000);
      }
    }
  });
}
loadPlans();
</script>
</body>
</html>
